name: Deploy to EC2

on:
  # Every push to main ships, merged pull requests included.
  push:
    branches: [main]
  # Kept for redeploying by hand from the Actions tab, without a new commit.
  workflow_dispatch:

# One deploy at a time: a second push waits for the first to finish rather
# than rebuilding on the box at the same time. Never cancelled midway, which
# could leave the stack half restarted.
concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Rebuild and restart the stack on EC2
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.EC2_HOST }} '
            set -euo pipefail
            cd flight_companion

            # Explicit branch: a bare "git pull" takes whatever branch the box
            # happens to be checked out on, which silently deploys stale code.
            # --ff-only fails loudly rather than merging if the box has drifted.
            git fetch origin
            git checkout main
            git pull --ff-only origin main

            docker compose -f compose.prod.yaml build

            # Bring the database up on its own first so migrations run against a
            # schema nothing is serving from yet.
            docker compose -f compose.prod.yaml up -d db
            docker compose -f compose.prod.yaml run --rm backend alembic upgrade head
            # Alliance membership is a list in code, not part of the data dump:
            # re-applied every deploy so an edit to it ships with the code.
            docker compose -f compose.prod.yaml run --rm backend python -m app.alliances

            docker compose -f compose.prod.yaml up -d
            docker image prune -f
          '
