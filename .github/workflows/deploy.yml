name: Deploy to EC2

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Rebuild and restart container on EC2
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.EC2_HOST }} '
            cd flight_companion &&
            git pull &&
            docker build -t flight-companion . &&
            (docker stop flight-companion || true) &&
            (docker rm flight-companion || true) &&
            docker run -d --name flight-companion -p 80:80 --restart unless-stopped flight-companion
          '
