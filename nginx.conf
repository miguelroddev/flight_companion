# redirect all plain HTTP to HTTPS
server {
    listen 80;
    server_name flightcompanion.miguelrodrigues.dev;
    return 301 https://$host$request_uri;
}

limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;

server {
    listen 443 ssl;
    server_name flightcompanion.miguelrodrigues.dev;

    ssl_certificate /etc/letsencrypt/live/flightcompanion.miguelrodrigues.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/flightcompanion.miguelrodrigues.dev/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    limit_req zone=general burst=20 nodelay;

    # /api/airports alone is ~390KB of JSON for the whole dataset, and gzip is
    # off for proxied responses by default.
    gzip on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css image/svg+xml;

    location /api/ {
        # Docker's embedded DNS, resolved per request rather than at startup:
        # with a literal proxy_pass nginx refuses to boot whenever the backend
        # container is not already up, which turns a slow backend into a dead
        # site. The variable form does not forward the URI on its own, hence
        # the explicit $request_uri.
        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://backend:8000;
        proxy_pass $api_upstream$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
