# nginx inside the "web" container. It only speaks plain HTTP on the Docker
# network: the shared Caddy proxy (the "edge" network) takes the traffic from the
# internet, handles HTTPS and certificates, and forwards requests here.

# Requests arrive from Caddy, so $remote_addr would always be Caddy's IP and the
# rate limit below would count every visitor as one. This restores the real
# visitor IP from the X-Forwarded-For header Caddy sends.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 10.0.0.0/8;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;

server {
    listen 80;
    server_name flightcompanion.miguelrodrigues.dev;

    root /usr/share/nginx/html;
    index index.html;

    limit_req zone=general burst=20 nodelay;

    # /api/airports alone is ~390KB of JSON for the whole dataset, and gzip is
    # off for proxied responses by default.
    gzip on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css image/svg+xml;

    location /api/ {
        # Docker's embedded DNS, resolved per request rather than at startup:
        # with a literal proxy_pass nginx refuses to boot whenever the backend
        # container is not already up, which turns a slow backend into a dead
        # site. The variable form does not forward the URI on its own, hence
        # the explicit $request_uri.
        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://backend:8000;
        proxy_pass $api_upstream$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # The visitor spoke HTTPS to Caddy; $scheme here would be "http".
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
